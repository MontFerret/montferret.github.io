{{- $children := .Page.Pages.ByTitle -}}
{{- if eq (len $children) 0 -}}
    {{- errorf "The stdlib-children shortcode requires generated child pages: %s" .Position -}}
{{- end -}}
<div class="docs-section-card-grid stdlib-section-card-grid">
    {{- range $children }}
    <a class="docs-section-card" href="{{ .RelPermalink }}">
        <strong>{{ .Title }}</strong>
        {{- with .Description }}<span>{{ . }}</span>{{ end }}
    </a>
    {{- end }}
</div>
