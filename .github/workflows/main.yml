name: Website

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: themes/ferret/package-lock.json

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.159.1"
          extended: true

      - name: Set up Pages
        if: github.ref == 'refs/heads/dev'
        uses: actions/configure-pages@v6

      - name: Download Go dependencies
        run: go mod download

      - name: Install theme dependencies
        uses: magefile/mage-action@v4
        with:
          version: v1.14.0
          args: install

      - name: Test Go packages
        run: go test ./...

      - name: Test theme
        run: npm --prefix themes/ferret test

      - name: Build website
        uses: magefile/mage-action@v4
        with:
          version: v1.14.0
          args: build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
