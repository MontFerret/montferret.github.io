workerURL: "https://worker-pucbyp2omq-ue.a.run.app"
workerV2URL: "https://worker-v2-811908774949.us-east1.run.app"
playgroundURL: "https://playground-811908774949.us-east1.run.app"
theme: "ace/theme/tomorrow_night"
examples:
  - title: Mockery product extraction
    source: |-
      // Open the product listing in the hosted browser.
      let doc = web::html::document('https://mockery.ferretlang.org/scenarios/dynamic-products/basic/')

      // Wait for JavaScript to render the product cards.
      let products = waitfor value doc[~ css`.product-card`]
          when length(.) > 0
          timeout 5000

      return for product in products
          return {
              brand: product[~? css`.product-brand`].textContent,
              title: product[~? css`.product-title`].textContent,
              price: to_float(replace(product[~? css`.product-price`].textContent, '$', '')) on error return 0
          }
  - title: Basic evaluation
    source: return 1 + 2
  - title: Bind parameters
    source: return @payload
    params:
      payload:
        name: Ada
        values: [0, false, null]
  - title: Collection transformation
    source: |-
      return for price in [3, 12, 20]
          filter price >= 10
          return price * 2
